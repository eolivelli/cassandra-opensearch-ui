server:
  # The DB UI console runs on 8080; the store runs alongside it on 8081.
  port: 8081
  servlet:
    session:
      timeout: 60m

spring:
  application:
    name: h2o-store

store:
  name: H2O Store
  # Mock authentication: a single demo account. NOT a real security mechanism.
  demo-username: user
  demo-password: password
  demo-full-name: Demo Customer
  cassandra:
    host: 127.0.0.1
    port: 9042
    local-datacenter: datacenter1
    keyspace: h2o_store
  opensearch:
    url: http://127.0.0.1:9200
    username: ""
    password: ""
    index: h2o_products

logging:
  level:
    com.dbui.store: INFO
